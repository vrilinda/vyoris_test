{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white rounded-xl shadow-md p-8 border border-[var(--border-color)]">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-900 academic-title">Sign In</h2>
        <p class="text-gray-500 mt-2">Passwordless Authentication</p>
    </div>

    <div id="auth-form-container">
        <form 
            hx-post="/auth/send-otp" 
            hx-target="#auth-form-container"
            hx-swap="innerHTML"
            class="space-y-6">
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                <div class="mt-1">
                    <input id="email" name="email" type="email" autocomplete="email" required 
                        class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-forest-600 focus:border-forest-600 sm:text-sm"
                        placeholder="you@example.com">
                </div>
                <p class="mt-2 text-xs text-gray-500">We'll email you a secure 6-digit code. No password required.</p>
            </div>

            <div>
                <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-forest-600 hover:bg-forest-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-forest-600 htmx-request-button">
                    <span class="htmx-indicator-hidden">Send Magic Code</span>
                    <span class="htmx-indicator flex items-center">
                        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Sending...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
