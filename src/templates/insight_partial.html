<div class="bg-white rounded-xl shadow-sm p-8 border border-[var(--border-color)] animate-[fadeIn_0.5s_ease-out]">
    <div class="flex items-center justify-between border-b border-[var(--border-color)] pb-4 mb-8">
        <h2 class="text-3xl font-bold academic-title">Analysis: <span class="text-forest-600">{{ ticker }}</span></h2>
        <span class="px-4 py-1.5 bg-forest-50 text-forest-700 text-sm font-semibold rounded-full border border-forest-600/20 shadow-sm">
            Synthesis Complete
        </span>
    </div>
    
    <!-- Render the Markdown directly using Tailwind's prose typography plugin. We use prose-slate for standard academic reading -->
    <div class="prose prose-slate max-w-none prose-headings:academic-title prose-headings:font-bold prose-a:text-forest-600 prose-a:no-underline hover:prose-a:underline">
        {{ insight | safe }}
    </div>
</div>
