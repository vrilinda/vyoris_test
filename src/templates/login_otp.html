<div>
    <div class="mb-6 p-4 bg-green-50 text-green-700 rounded-md border border-green-200">
        <p class="text-sm">We've sent a 6-digit code to <strong>{{ email }}</strong>.</p>
        <p class="text-xs mt-1 text-green-600">Please ignore the magic link in the email and manually type the code below.</p>
    </div>

    <form 
        hx-post="/auth/verify-otp" 
        hx-target="#auth-form-container"
        hx-swap="innerHTML"
        class="space-y-6">
        
        <input type="hidden" name="email" value="{{ email }}">
        
        <div>
            <label for="token" class="block text-sm font-medium text-gray-700">6-Digit Code</label>
            <div class="mt-1">
                <input id="token" name="token" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"
                    class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-forest-600 focus:border-forest-600 sm:text-lg tracking-widest text-center"
                    placeholder="123456">
            </div>
        </div>

        <div>
            <button type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-forest-600 hover:bg-forest-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-forest-600 htmx-request-button">
                <span class="htmx-indicator-hidden">Verify and Sign In</span>
                <span class="htmx-indicator flex items-center">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Verifying...
                </span>
            </button>
        </div>
    </form>
    
    <div class="mt-4 text-center">
        <a href="/login" class="text-sm text-forest-600 hover:text-forest-500 font-medium">Use a different email</a>
    </div>
</div>
